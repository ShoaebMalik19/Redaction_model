<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pii-redaction-engine demo</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .panel { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 8px; margin-bottom: 8px; }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  button.secondary { background: #334155; }
  #status { font-size: 13px; color: #fbbf24; min-height: 20px; margin-top: 8px; white-space: pre-wrap; }
  canvas { max-width: 100%; border-radius: 8px; border: 1px solid #334155; }
  #results { margin-top: 12px; font-size: 13px; }
  .det-row { padding: 6px 10px; background: #0f172a; border-radius: 6px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
  .badge-pii { background: #ef4444; }
  .badge-face { background: #3b82f6; }
  .badge-regex { background: #22c55e; }
  .badge-dom { background: #a855f7; }
  .stat { display: inline-block; margin-right: 24px; }
  .stat b { color: #4ade80; }
  input[type=file] { color: #e2e8f0; }
  .legend { font-size: 12px; color: #94a3b8; margin-top: 8px; }
  .legend span { margin-right: 16px; }
  .login-mock { max-width: 380px; position: relative; background: #1a1a1a; padding: 24px; border-radius: 10px; }
  .login-mock input[type=text], .login-mock input[type=password] {
    display: block; width: 100%; padding: 12px; margin-bottom: 14px; background: #2d2d2d; border: none;
    border-radius: 8px; color: #ccc; box-sizing: border-box; font-size: 14px;
  }
  .login-mock button.loginbtn { width: 100%; padding: 13px; background: #78b43c; color: white; border: none; border-radius: 8px; font-weight: bold; }
</style>
</head>
<body>
<h1>pii-redaction-engine — demo / testbed</h1>
<div class="sub">Uses the actual published module (src/redaction-engine.js), not a copy — this page is also the regression test surface.</div>

<div class="panel">
  <h3 style="margin-top:0;">Layer 0 — Live DOM Check</h3>
  <div id="loginMockWrap" style="position:relative;">
    <div class="login-mock" id="loginMock">
      <input type="text" autocomplete="username" value="JerushVijay" placeholder="Username">
      <input type="password" value="isuefhisueghisuegiuseg">
      <button class="loginbtn">Log In</button>
    </div>
  </div>
  <button id="btnDomCheck">Run DOM Check + Redact</button>
  <div id="domStatus" style="font-size:13px;color:#fbbf24;margin-top:8px;"></div>
</div>

<h3>Layers 1-3 — Vision + OCR pipeline</h3>
<div class="panel">
  <button id="btnSampleForm">Load Sample Form</button>
  <button id="btnSampleFace">Load Sample Face</button>
  <button id="btnSampleChat">Load Chat Screenshot</button>
  <button id="btnSampleAadhaar">Load ID Card Sample</button>
  <label class="secondary" style="display:inline-block;background:#334155;padding:10px 16px;border-radius:6px;cursor:pointer;">
    Upload Your Own Image <input type="file" id="fileInput" accept="image/*" style="display:none;">
  </label>
  <button id="btnDetect" disabled>Run Combined Detection</button>
  <button id="btnRedact" class="secondary" disabled>Toggle Redaction View</button>
  <div id="status">Loading models...</div>
  <div class="legend">
    <span><span class="badge badge-dom">&nbsp;</span>DOM</span>
    <span><span class="badge badge-pii">&nbsp;</span>PII model</span>
    <span><span class="badge badge-face">&nbsp;</span>SCRFD</span>
    <span><span class="badge badge-regex">&nbsp;</span>Regex/OCR (incl. name heuristic)</span>
  </div>
</div>

<div class="panel"><canvas id="canvas"></canvas></div>
<div class="panel"><div id="perfStats"></div><div id="results"></div></div>

<script type="module">
import { RedactionEngine, bracketLabel } from '../src/redaction-engine.js';

const engine = new RedactionEngine({
  ort: window.ort,
  Tesseract: window.Tesseract,
  modelUrls: { pii: '../test-images/model_pii.onnx', face: '../test-images/model_face.onnx' },
});

const statusEl = document.getElementById('status');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btnDetect = document.getElementById('btnDetect');
const btnRedact = document.getElementById('btnRedact');
const perfStats = document.getElementById('perfStats');
const resultsEl = document.getElementById('results');

let currentImg = null, lastRegions = [], redactMode = false;

function setStatus(msg) { statusEl.textContent = msg; console.log(msg); }

engine.init().then(() => setStatus('Models ready. Load an image to begin.')).catch(e => setStatus('Init error: ' + e.message));

function loadImageToCanvas(imgEl) {
  currentImg = imgEl;
  canvas.width = imgEl.naturalWidth;
  canvas.height = imgEl.naturalHeight;
  ctx.drawImage(imgEl, 0, 0);
  btnDetect.disabled = false;
  btnRedact.disabled = true;
  redactMode = false;
  resultsEl.innerHTML = '';
  perfStats.innerHTML = '';
}
function loadSample(url) {
  const img = new Image();
  img.onload = () => loadImageToCanvas(img);
  img.onerror = () => setStatus('Failed to load ' + url);
  img.src = url;
}
document.getElementById('btnSampleForm').onclick = () => loadSample('../test-images/test_form.png');
document.getElementById('btnSampleFace').onclick = () => loadSample('../test-images/multiface_grid.png');
document.getElementById('btnSampleChat').onclick = () => loadSample('../test-images/chat_screenshot.jpg');
document.getElementById('btnSampleAadhaar').onclick = () => loadSample('../test-images/aadhaar_sample.png');
document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => loadImageToCanvas(img);
  img.src = URL.createObjectURL(file);
};

document.getElementById('btnDetect').onclick = async () => {
  btnDetect.disabled = true;
  setStatus('Running detect()...');
  try {
    const { regions, timings } = await engine.detect(currentImg);
    lastRegions = regions;
    perfStats.innerHTML =
      `<span class="stat">PII: <b>${timings.piiMs.toFixed(0)}ms</b></span>` +
      `<span class="stat">Face: <b>${timings.faceMs.toFixed(0)}ms</b></span>` +
      `<span class="stat">OCR/Regex: <b>${timings.ocrMs.toFixed(0)}ms</b></span>` +
      `<span class="stat">Total regions: <b>${regions.length}</b></span>`;
    draw();
    resultsEl.innerHTML = regions.map(d =>
      `<div class="det-row"><span><span class="badge badge-${d.source}">${d.source}</span>${d.label}</span><span>${(d.score*100).toFixed(0)}%</span></div>`
    ).join('') || '<div style="color:#64748b">No regions detected.</div>';
    setStatus('Detection complete.');
  } catch (e) {
    setStatus('ERROR: ' + e.message + '\n' + (e.stack || ''));
  }
  btnDetect.disabled = false;
  btnRedact.disabled = false;
};

function draw() {
  ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);
  if (redactMode) {
    engine.redactCanvas(ctx, lastRegions);
  } else {
    const colors = { pii: '#ef4444', face: '#3b82f6', regex: '#22c55e', dom: '#a855f7' };
    for (const d of lastRegions) {
      ctx.strokeStyle = colors[d.source]; ctx.lineWidth = 3;
      ctx.strokeRect(d.x1, d.y1, d.x2 - d.x1, d.y2 - d.y1);
      ctx.fillStyle = colors[d.source]; ctx.font = '14px sans-serif';
      ctx.fillText(`${d.label} ${d.score.toFixed(2)}`, d.x1, Math.max(12, d.y1 - 4));
    }
  }
}
document.getElementById('btnRedact').onclick = () => {
  redactMode = !redactMode; draw();
  document.getElementById('btnRedact').textContent = redactMode ? 'Show Boxes + Labels' : 'Toggle Redaction View';
};

document.getElementById('btnDomCheck').onclick = () => {
  const wrap = document.getElementById('loginMockWrap');
  wrap.querySelectorAll('.__overlay').forEach(el => el.remove());
  const regions = engine.detectDom(wrap);
  const wrapRect = wrap.getBoundingClientRect();
  const relRegions = regions.map(r => ({ ...r, x1: r.x1 - wrapRect.left, y1: r.y1 - wrapRect.top, x2: r.x2 - wrapRect.left, y2: r.y2 - wrapRect.top }));
  for (const r of relRegions) {
    const div = document.createElement('div');
    div.className = '__overlay';
    div.textContent = bracketLabel(r.label);
    div.style.cssText = `position:absolute; left:${r.x1}px; top:${r.y1}px; width:${r.x2-r.x1}px; height:${r.y2-r.y1}px; background:#000000; display:flex; align-items:center; justify-content:center; color:#ffffff; font-weight:bold; font-size:11px;`;
    wrap.appendChild(div);
  }
  document.getElementById('domStatus').textContent = `DOM check complete — ${regions.length} field(s) found and redacted (0ms inference).`;
};
</script>
</body>
</html>
